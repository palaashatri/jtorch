name: Oracle

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jtorch-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
      - name: Install the pinned oracle runtime
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/oracle/requirements.txt
          python3 -m pip check
      - name: Record the oracle environment
        run: |
          python3 --version
          python3 -c "import torch, safetensors, packaging; print('torch', torch.__version__); print('safetensors', safetensors.__version__); print('packaging', packaging.__version__)"
      - name: Regenerate parity fixtures
        run: python3 tools/oracle/generate.py
      - name: Regenerate optimizer fixtures
        run: python3 tools/oracle/optimizers.py
      - name: Regenerate Safetensors fixture
        run: python3 tools/oracle/safetensors_fixture.py
      - name: Regenerate schema outputs
        run: ./gradlew --no-daemon regenerateSchemas
      - name: Fail on drift
        run: |
          git status --porcelain
          git diff --exit-code
      - name: Upload regenerated fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-fixtures
          retention-days: 7
          path: |
            tests/parity/src/test/resources/golden
            modules/jtorch-optim/src/test/resources/optimizers.json
            modules/jtorch-serialization/src/test/resources/golden
