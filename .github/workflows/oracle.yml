name: Oracle

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jtorch-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
      - name: Install the pinned oracle runtime
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch==2.11.0 safetensors==0.7.0
      - name: Regenerate parity fixtures
        run: |
          python3 tools/oracle/generate.py
          python3 tools/oracle/optimizers.py
          python3 tools/oracle/safetensors_fixture.py
      - name: Regenerate schema outputs
        run: ./gradlew --no-daemon regenerateSchemas
      - name: Fail on drift
        run: |
          git status --porcelain
          git diff --exit-code
